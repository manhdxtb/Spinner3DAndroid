apply plugin: 'com.android.library'

android {
    namespace 'com.google.android.ads.nativetemplates'

    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pgcfg'
            consumerProguardFiles 'proguard-rules.pgcfg'
        }
    }

    lintOptions {
        resourcePrefix 'gnt_'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'com.google.android.material:material:1.13.0'

    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'

    api("com.akexorcist:localization:1.2.11")

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.errorprone:error_prone_annotations:2.44.0'

    api 'net.yslibrary.keyboardvisibilityevent:keyboardvisibilityevent:3.0.0-RC3'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'io.reactivex:rxandroid:1.2.1'

    implementation 'com.appsflyer:af-android-sdk:6.17.4'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    implementation 'com.google.ads.mediation:vungle:7.6.0.0'
    implementation 'com.google.ads.mediation:facebook:6.21.0.0'
    implementation 'com.google.ads.mediation:mintegral:17.0.21.0'
    implementation 'com.google.ads.mediation:pangle:7.7.0.2.0'
}
